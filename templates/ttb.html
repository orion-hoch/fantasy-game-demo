<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticking Time Bomb — Fantasy Football Trivia</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/ttb.css">
</head>
<body>

<div id="red-flash"></div>

<div id="ttb-app">
    <header>
        <div class="header-inner">
            <a href="/" class="back-link">&#8592; Home</a>
            <h1>&#x1F4A3; Ticking Time Bomb</h1>
        </div>
    </header>

    <div id="hint-bar">Identify the mystery player from their teammates — 5 guesses before it blows!</div>

    <!-- Main game area: fuse chain above, bomb below -->
    <div id="game-area">

        <!-- Fuse chain: teammate nodes stack here (oldest at top → bomb at bottom) -->
        <div id="fuse-chain">
            <div id="chain-spark" class="hidden">&#x2736;</div>
            <div id="chain-nodes">
                <!-- chain nodes injected by JS -->
            </div>
            <!-- Short wire connecting chain to bomb cap -->
            <div id="chain-tail" class="hidden"></div>
        </div>

        <!-- Bomb cap + body -->
        <div id="bomb-wrap">
            <div id="bomb-cap" class="hidden"></div>
            <div id="bomb-body">
                <div id="bomb-inner">
                    <span id="bomb-num">?</span>
                    <span id="bomb-label">guesses</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Wrong guesses -->
    <div id="wrong-guesses"></div>

    <!-- Feedback -->
    <div id="ttb-feedback"></div>

    <!-- Search + guess input -->
    <div id="ttb-search-area">
        <div id="ttb-search-wrapper">
            <input
                id="ttb-input"
                type="text"
                placeholder="Search player name..."
                autocomplete="off"
                disabled
            />
            <div id="ttb-search-results"></div>
        </div>
        <button id="ttb-submit-btn" onclick="ttbSubmit()" disabled>Guess</button>
    </div>

    <!-- Action buttons -->
    <div id="ttb-action-area">
        <button id="ttb-start-btn"    class="ttb-btn ttb-btn-red"   onclick="ttbStart()">&#x23F1; Start Game</button>
        <button id="ttb-give-up-btn"  class="ttb-btn ttb-btn-ghost hidden" onclick="ttbGiveUp()">Give Up</button>
        <button id="ttb-play-again-btn" class="ttb-btn ttb-btn-red hidden" onclick="ttbStart()">Play Again</button>
    </div>
</div>

<script src="/static/ttb.js"></script>
</body>
</html>
