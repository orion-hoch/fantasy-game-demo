<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticking Time Bomb — Fantasy Football Trivia</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/ttb.css">
</head>
<body>

<div id="red-flash"></div>

<div id="ttb-app">
    <header>
        <div class="header-inner">
            <a href="/" class="back-link">&#8592; Home</a>
            <h1>&#x1F4A3; Ticking Time Bomb</h1>
        </div>
    </header>

    <div id="hint-bar">Identify the mystery player from their teammates — 5 turns before it blows!</div>

    <!-- Fuse chain + bomb -->
    <div id="game-area">
        <div id="fuse-chain">
            <div id="chain-spark" class="hidden">&#x2736;</div>
            <div id="chain-nodes"></div>
            <div id="chain-tail" class="hidden"></div>
        </div>
        <div id="bomb-wrap">
            <div id="bomb-cap" class="hidden"></div>
            <div id="bomb-body">
                <div id="bomb-inner">
                    <span id="bomb-num">?</span>
                    <span id="bomb-label">press start</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Answer reveal (shown on loss / give up) -->
    <div id="answer-reveal" class="hidden">
        <div class="answer-label">The answer was</div>
        <div id="answer-name"></div>
    </div>

    <!-- Wrong guess chips -->
    <div id="wrong-guesses"></div>

    <!-- Hints section (toggleable) -->
    <div id="hints-section">
        <button id="hints-toggle-btn" class="ttb-btn ttb-btn-hint hidden" onclick="toggleHints()">
            &#x1F4A1; Show Hints
        </button>
        <div id="hints-panel" class="hidden">
            <!-- hint rows injected by JS -->
        </div>
    </div>

    <!-- Feedback -->
    <div id="ttb-feedback"></div>

    <!-- Search + guess -->
    <div id="ttb-search-area">
        <div id="ttb-search-wrapper">
            <input
                id="ttb-input"
                type="text"
                placeholder="Search player name..."
                autocomplete="off"
                disabled
            />
            <div id="ttb-search-results"></div>
        </div>
        <button id="ttb-submit-btn" onclick="ttbSubmit()" disabled>Guess</button>
    </div>

    <!-- Action buttons -->
    <div id="ttb-action-area">
        <button id="ttb-start-btn"     class="ttb-btn ttb-btn-red   hidden" onclick="ttbStart()">&#x23F1; Start Game</button>
        <button id="ttb-skip-btn"      class="ttb-btn ttb-btn-ghost hidden" onclick="ttbSkip()">Skip &#x2192;</button>
        <button id="ttb-give-up-btn"   class="ttb-btn ttb-btn-ghost hidden" onclick="ttbGiveUp()">Give Up</button>
        <button id="ttb-play-again-btn" class="ttb-btn ttb-btn-red  hidden" onclick="ttbStart()">Play Again</button>
    </div>
</div>

<script src="/static/ttb.js"></script>
</body>
</html>
