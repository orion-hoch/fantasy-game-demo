<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g transform="rotate(-35 32 32)">
    <!-- hard shadow -->
    <path d="M9,36 Q20,20 32,20 Q44,20 55,36 Q44,52 32,52 Q20,52 9,36 Z"
          fill="#000" opacity="0.7"/>
    <!-- body -->
    <path d="M8,32 Q19,16 32,16 Q45,16 56,32 Q45,48 32,48 Q19,48 8,32 Z"
          fill="#1c1820" stroke="#147a6e" stroke-width="4"/>
    <!-- centre seam -->
    <line x1="32" y1="17" x2="32" y2="47" stroke="#1aad9d" stroke-width="2.5" stroke-linecap="square"/>
    <!-- lace stitches -->
    <line x1="26" y1="24" x2="38" y2="24" stroke="#1aad9d" stroke-width="3" stroke-linecap="square"/>
    <line x1="26" y1="30" x2="38" y2="30" stroke="#1aad9d" stroke-width="3" stroke-linecap="square"/>
    <line x1="26" y1="36" x2="38" y2="36" stroke="#1aad9d" stroke-width="3" stroke-linecap="square"/>
    <line x1="26" y1="42" x2="38" y2="42" stroke="#1aad9d" stroke-width="3" stroke-linecap="square"/>
    <!-- tip caps -->
    <circle cx="8"  cy="32" r="3.5" fill="#147a6e"/>
    <circle cx="56" cy="32" r="3.5" fill="#147a6e"/>
  </g>
</svg>
